name: Scoped related candidate staging
on:
  pull_request:
    branches: [feature/ticket-related-implementations]
permissions:
  contents: read
concurrency:
  group: scoped-related-stage-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  contracts:
    if: github.event.pull_request.head.repo.full_name == 'bpstr/codanna' && github.event.pull_request.head.ref == 'integration/scoped-ticket-relevance'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Refresh native linker artifacts
        run: cargo clean -p ort-sys
      - name: Record the unsupported-scope baseline
        shell: bash
        run: |
          cargo fmt --all
          sha256sum tests/scoped_ticket_related.rs > "$RUNNER_TEMP/scoped-test-before.sha256"
          set +e
          cargo test --locked --test scoped_ticket_related -- --nocapture 2>&1 | tee "$RUNNER_TEMP/scoped-related-before.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'test result: FAILED. 1 passed; 4 failed;' "$RUNNER_TEMP/scoped-related-before.log"
      - name: Apply only the pinned reviewed scope wiring
        run: python3 contributing/scripts/apply-scoped-related-candidate.py
      - name: Verify scoped evidence and combined relevance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/scoped-test-before.sha256"
          {
            git rev-parse HEAD
            rustc --version --verbose
            cargo test --locked --test scoped_ticket_related --test ticket_related_relevance --test repository_task_relevance --test scoped_search_snapshots --test symbol_path_scope --test symbol_scope_cli --test ticket_related_cli --test symbol_ranking_regressions --test symbol_ranking_runtime_holdout -- --nocapture
            for filter in ticket_related ticket_code_fusion scoped_graph scope_snapshot scope_inventory scope_cache linguistic_coverage ranking_efficiency; do
              cargo test --locked --lib "$filter" -- --list | tee "$RUNNER_TEMP/selected-$filter.txt"
              grep -Eq ': test$' "$RUNNER_TEMP/selected-$filter.txt"
              cargo test --locked --lib "$filter" -- --nocapture
            done
            cargo test --locked --test workspace_mcp ticket_code_fusion -- --nocapture
            cargo test --locked --lib hardening_final_tool_catalog_matches_generated_schemas_and_guidance -- --nocapture
            cargo fmt --all -- --check
            cargo clippy --locked --all-targets --all-features -- -D warnings
          } 2>&1 | tee "$RUNNER_TEMP/scoped-related-after.log"
      - name: Publish verified immutable source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request
          names = ['src/storage/tantivy/graph.rs','src/storage/tantivy/graph_scope.rs','src/mcp/tools/ticket_related.rs','src/mcp/tools/ticket_related_tests.rs','tests/ticket_related_cli.rs','tests/scoped_ticket_related.rs']
          manifest = {'staged_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':{}}
          for name in names:
              data = pathlib.Path(name).read_bytes()
              expected = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              request = urllib.request.Request('https://api.github.com/repos/bpstr/codanna/git/blobs',
                  data=json.dumps({'content':data.decode(),'encoding':'utf-8'}).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response:
                  actual=json.load(response)['sha']
              assert actual == expected, name
              manifest['files'][name]={'blob_sha':actual,'sha256':hashlib.sha256(data).hexdigest()}
          pathlib.Path(os.environ['RUNNER_TEMP'],'scoped-related-blobs.json').write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoped-related-evidence
          path: |
            ${{ runner.temp }}/scoped-related-before.log
            ${{ runner.temp }}/scoped-related-after.log
            ${{ runner.temp }}/scoped-related-blobs.json
          retention-days: 14
          if-no-files-found: warn
