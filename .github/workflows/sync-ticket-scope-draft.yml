name: Synchronize ticket scope dependency
on:
  push:
    branches: ['feature/ticket-code-fusion']
    paths: ['.github/workflows/sync-ticket-scope-draft.yml']
permissions:
  contents: read
jobs:
  synchronize:
    if: github.repository == 'bpstr/codanna' && github.ref == 'refs/heads/feature/ticket-code-fusion'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Merge only the inspected dependency revision
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import pathlib, subprocess
          dependency = '7715ed08b2403721fb1d0e415052268bd44cacff'
          merged = subprocess.run(['git', '-c', 'core.hooksPath=/dev/null', 'merge', '--no-commit', '--no-ff', dependency])
          if merged.returncode:
              conflicts = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines()
              if conflicts != ['src/mcp/catalog.rs']:
                  raise SystemExit(f'Unreviewed conflicts; nothing published: {conflicts}')
              path = conflicts[0]
              ours = subprocess.check_output(['git', 'show', f'HEAD:{path}'], text=True)
              base = subprocess.check_output(['git', 'show', f'{dependency}:{path}'], text=True)
              entry = '    SearchTicketContext => ("search_ticket_context",["query","code_limit","document_limit","conversation_limit","collection","code_path_prefix","include_semantic_code","include_conversations"],["query"],Some("query"),Read),\n'
              if ours.count(entry) != 1 or ours.replace(entry, '') != base:
                  raise SystemExit('Catalog differs beyond the reviewed new ticket entry')
              # Both catalogs have the exact same scope fields. The only
              # difference is our new tool entry, which must not be removed.
              pathlib.Path(path).write_text(ours)
              subprocess.run(['git', 'add', '--', path], check=True)
          PY
          # The connected app publishes workflow changes separately; this token
          # performs ordinary source writes only, without broader permissions.
          git restore --source=HEAD --staged --worktree -- .github/workflows/symbol-path-scope.yml
          rustfmt --edition 2024 --config skip_children=true src/cli/commands/mcp.rs src/mcp/catalog.rs
          git add -- src/cli/commands/mcp.rs src/mcp/catalog.rs
          git diff --cached --check
      - name: Publish the dependency merge to the draft branch only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c core.hooksPath=/dev/null commit -m 'Integrate scoped CLI and workspace lifecycle fixes into ticket retrieval'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/feature/ticket-code-fusion
          git rev-parse HEAD
