name: Review final snapshot

on:
  push:
    branches: [work/review-20260912]
    paths: [.github/workflows/review-final-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: acbc9470c2f6e211975d2cd89cf4e16c07196166
          persist-credentials: false
      - name: Archive reviewed commit without credentials
        run: |
          git archive --format=tar.gz --output="$RUNNER_TEMP/pr23-source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: pr23-final-source
          path: |
            ${{ runner.temp }}/pr23-source.tar.gz
            ${{ runner.temp }}/source-commit.txt
          retention-days: 3
          if-no-files-found: error
