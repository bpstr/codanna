name: Review workbench

on:
  push:
    branches: [work/review-20260912]
    paths: [.github/workflows/review-workbench.yml, review.continuation-fixes.py]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preserve reviewed continuation
        run: |
          cat review.continuation.part*.b64 > "$RUNNER_TEMP/continuation.b64"
          cp review.continuation-fixes.py "$RUNNER_TEMP/continuation-fixes.py"
      - uses: actions/checkout@v6
        with:
          ref: 0d0a8f5e5678744ed7fd1764f70f537c2e331a07
          persist-credentials: false
      - name: Apply hash-verified continuation
        id: apply
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          encoded = Path(os.environ['RUNNER_TEMP'], 'continuation.b64').read_bytes()
          encoded = b''.join(encoded.split()).replace(b'mPj1LizTPDq3', b'mPj1LizPDq3')
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '2fc337b18b835d0bec4f17ca44202fee7a6365f1c210255b8410f94167f25716'
          prepared = []
          for change in json.loads(raw):
              path = Path(change['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert not path.is_symlink()
              old = path.read_bytes() if path.exists() else b''
              if change['old'] is None:
                  assert not path.exists(), str(path)
              else:
                  assert hashlib.sha256(old).hexdigest() == change['old'], str(path)
              lines = old.decode().splitlines(keepends=True)
              for first, last, replacement in reversed(change['edits']):
                  lines[first:last] = replacement.splitlines(keepends=True)
              new = ''.join(lines).encode()
              assert hashlib.sha256(new).hexdigest() == change['new'], str(path)
              prepared.append((path, new))
          for path, new in prepared:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(new)
          Path(os.environ['RUNNER_TEMP'], 'changed-rust.txt').write_text('\n'.join(str(p) for p, _ in prepared if p.suffix == '.rs'))
          print(f'Applied {len(prepared)} verified source changes')
          PY
          python3 "$RUNNER_TEMP/continuation-fixes.py"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Format changed Rust files
        run: |
          xargs -d '\n' rustfmt --edition 2024 --config skip_children=true < "$RUNNER_TEMP/changed-rust.txt"
          git add -N .
          git diff --check
      - name: Deterministic regression suite
        run: bash contributing/scripts/review-regressions.sh 2>&1 | tee "$RUNNER_TEMP/continuation-tests.log"
      - name: Strict Clippy including all targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/continuation-clippy.log"
      - name: Build without default features
        run: cargo check --locked --no-default-features 2>&1 | tee "$RUNNER_TEMP/continuation-minimal.log"
      - name: Documentation build
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features 2>&1 | tee "$RUNNER_TEMP/continuation-docs.log"
      - name: Export exact candidate patch
        if: always()
        run: |
          git add -N .
          git diff --binary > "$RUNNER_TEMP/continuation-tested.patch"
          git diff --stat > "$RUNNER_TEMP/continuation-stat.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-continuation-validation
          path: |
            ${{ runner.temp }}/continuation-tested.patch
            ${{ runner.temp }}/continuation-stat.txt
            ${{ runner.temp }}/continuation-*.log
            ${{ runner.temp }}/continuation.b64
          retention-days: 3
          if-no-files-found: error
