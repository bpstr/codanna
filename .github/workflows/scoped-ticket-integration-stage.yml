name: Scoped ticket integration staging
on:
  pull_request:
    branches: [feature/ticket-related-implementations]
permissions:
  contents: read
concurrency:
  group: scoped-ticket-integration-stage-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  contracts:
    if: github.event.pull_request.head.repo.full_name == 'bpstr/codanna' && github.event.pull_request.head.ref == 'integration/scoped-ticket-relevance'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Merge only the pinned dependency heads locally
        run: python3 contributing/scripts/prepare-ticket-relevance-integration.py
      - name: Refresh native linker artifacts
        run: cargo clean -p ort-sys
      - name: Verify combined relevance and scope contracts
        shell: bash
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            rustc --version --verbose
            sha256sum src/storage/tantivy/query.rs src/storage/tantivy/scope.rs src/storage/tantivy/linguistic_coverage.rs src/mcp/tools/ticket_related.rs contributing/retrieval/evaluations/repository-tasks.json
            cargo test --locked --test ticket_related_relevance --test repository_task_relevance --test scoped_search_snapshots --test symbol_path_scope --test symbol_scope_cli --test ticket_related_cli --test symbol_ranking_regressions --test symbol_ranking_runtime_holdout -- --nocapture
            for filter in ticket_related ticket_code_fusion scope_snapshot scope_inventory scope_cache linguistic_coverage ranking_efficiency; do
              cargo test --locked --lib "$filter" -- --list | tee "$RUNNER_TEMP/selected-$filter.txt"
              grep -Eq ': test$' "$RUNNER_TEMP/selected-$filter.txt"
              cargo test --locked --lib "$filter" -- --nocapture
            done
            cargo test --locked --test workspace_mcp ticket_code_fusion -- --nocapture
            cargo test --locked --lib hardening_final_tool_catalog_matches_generated_schemas_and_guidance -- --nocapture
            cargo fmt --all -- --check
            cargo clippy --locked --all-targets --all-features -- -D warnings
          } 2>&1 | tee "$RUNNER_TEMP/scoped-ticket-integration.log"
      - name: Publish verified immutable blobs only
        env:
          GH_TOKEN: ${{ github.token }}
          STAGED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request
          staged = os.environ['STAGED_HEAD']
          names = subprocess.check_output(['git','diff','--name-only',staged,'HEAD'], text=True).splitlines()
          manifest = {'staged_head': staged, 'pins': ['43c15e159c61bda5f6c44be1a861f96652f606d2','c6f0a6a93372c57460fef870fb780cbc9ad9d044'], 'files': {}}
          for name in names:
              path = pathlib.Path(name)
              if not path.exists():
                  manifest['files'][name] = {'blob_sha': None}
                  continue
              data = path.read_bytes()
              expected = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              request = urllib.request.Request('https://api.github.com/repos/bpstr/codanna/git/blobs',
                  data=json.dumps({'content': data.decode(), 'encoding':'utf-8'}).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  actual = json.load(response)['sha']
              assert actual == expected, name
              manifest['files'][name] = {'blob_sha': actual, 'sha256': hashlib.sha256(data).hexdigest()}
          pathlib.Path(os.environ['RUNNER_TEMP'],'scoped-ticket-blobs.json').write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest,indent=2))
          PY
          git archive --format=tar.gz --output="$RUNNER_TEMP/scoped-ticket-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoped-ticket-integration
          path: |
            ${{ runner.temp }}/scoped-ticket-integration.log
            ${{ runner.temp }}/scoped-ticket-blobs.json
            ${{ runner.temp }}/scoped-ticket-source.tar.gz
          retention-days: 14
          if-no-files-found: warn
