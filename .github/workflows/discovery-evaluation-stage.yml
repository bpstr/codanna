name: Discovery evaluation staging
on:
  pull_request:
    branches: [fix/symbol-ranking-coverage]
    paths:
      - '.github/workflows/discovery-evaluation-stage.yml'
      - 'tests/repository_task_relevance.rs'
      - 'contributing/retrieval/evaluations/repository-tasks.json'
      - 'src/storage/tantivy/ranking_efficiency.rs'
permissions:
  contents: read
concurrency:
  group: discovery-evaluation-stage-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  contracts:
    if: github.event.pull_request.head.repo.full_name == 'bpstr/codanna' && github.event.pull_request.head.ref == 'perf/discovery-coverage-evaluation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Refresh native build artifacts
        run: cargo clean -p ort-sys
      - name: Measure frozen repository tasks before runtime change
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/discovery-head.txt"
          cargo test --locked --test repository_task_relevance -- --nocapture 2>&1 | tee "$RUNNER_TEMP/discovery-baseline.log"
      - name: Apply exact reviewed memoization wiring
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          def blob(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          q = Path('src/storage/tantivy/query.rs')
          assert blob(q.read_bytes()) == 'd1862b1e8ad32d04b619747cbf11b808f281d537'
          text = q.read_text()
          start = text.index('fn rerank_discovery_results(')
          end = text.index('/// Stored `relation_kind`', start)
          text = text[:start] + '''fn rerank_discovery_results(results: &mut Vec<SearchResult>, terms: &[String], limit: usize) {
              super::ranking_efficiency::sort_coverage_once(results, limit, |row| {
                  result_term_coverage(row, terms)
              });
          }

          ''' + text[end:]
          q.write_text(text)
          m = Path('src/storage/tantivy/mod.rs')
          assert blob(m.read_bytes()) == 'ce299a4ed759faee5fa6867be704416d792a5d32'
          m.write_text(m.read_text().replace('mod query;\n', 'mod query;\nmod ranking_efficiency;\n'))
          PY
          rustfmt --edition 2024 --config skip_children=true src/storage/tantivy/query.rs src/storage/tantivy/mod.rs src/storage/tantivy/ranking_efficiency.rs tests/repository_task_relevance.rs
          git diff --check
      - name: Verify unchanged relevance and neighboring contracts
        shell: bash
        run: |
          set -euo pipefail
          {
            sha256sum src/storage/tantivy/query.rs src/storage/tantivy/ranking_efficiency.rs tests/repository_task_relevance.rs contributing/retrieval/evaluations/repository-tasks.json
            cargo test --locked --test repository_task_relevance -- --nocapture
            cargo test --locked --lib ranking_efficiency -- --nocapture
            cargo test --locked --lib ranking_diagnostics -- --nocapture
            cargo test --locked --test symbol_ranking_regressions --test symbol_ranking_runtime_holdout --test retrieval_ranking_regressions -- --nocapture
            cargo test --locked --test adversarial_regressions search_graph -- --nocapture
            cargo fmt --all -- --check
            cargo clippy --locked --all-targets --all-features -- -D warnings
          } 2>&1 | tee "$RUNNER_TEMP/discovery-candidate.log"
          python3 - <<'PY'
          import json, os, pathlib
          def judgments(filename):
              records = []
              for line in pathlib.Path(os.environ['RUNNER_TEMP'], filename).read_text().splitlines():
                  if line.startswith('repository_task_relevance='):
                      record = json.loads(line.split('=', 1)[1])
                      record['top_5'] = [(row['name'], row['path']) for row in record['top_5']]
                      records.append(record)
              assert len(records) == 20, f'expected 20 actual query records, got {len(records)}'
              return sorted(records, key=lambda row: (row['task'], row['variant']))
          assert judgments('discovery-baseline.log') == judgments('discovery-candidate.log')
          print('frozen_task_rankings=identical_before_after')
          PY
      - name: Publish verified Git blobs without updating branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          paths = ['src/storage/tantivy/query.rs', 'src/storage/tantivy/mod.rs', 'src/storage/tantivy/ranking_efficiency.rs', 'tests/repository_task_relevance.rs']
          manifest = {}
          for name in paths:
              data = pathlib.Path(name).read_bytes()
              expected = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              request = urllib.request.Request('https://api.github.com/repos/bpstr/codanna/git/blobs', data=json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode()}).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  actual = json.load(response)['sha']
              assert actual == expected
              manifest[name] = {'sha': actual, 'sha256': hashlib.sha256(data).hexdigest()}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'discovery-blobs.json').write_text(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-evaluation-evidence
          path: |
            ${{ runner.temp }}/discovery-head.txt
            ${{ runner.temp }}/discovery-baseline.log
            ${{ runner.temp }}/discovery-candidate.log
            ${{ runner.temp }}/discovery-blobs.json
          retention-days: 14
