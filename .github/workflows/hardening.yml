name: Hardening

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  reliability:
    name: Reliability regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Capture formatting feedback
        id: formatting
        continue-on-error: true
        run: |
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/rustfmt.patch"
          git diff --quiet
      - name: Upload formatting patch for review
        if: steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/rustfmt.patch
          retention-days: 3
          if-no-files-found: warn
      - name: Run workspace CLI regressions without inference
        run: cargo test --test workspace_cli --all-features -- --nocapture
      - name: Run hardening regression tests
        run: cargo test hardening_ --all-features -- --nocapture
      - name: Run all library tests
        run: cargo test --lib --all-features
      - name: Require committed formatting
        if: always() && steps.formatting.outcome == 'failure'
        run: |
          echo 'Apply the uploaded rustfmt patch and commit it before merging.'
          exit 1

  linux-watcher:
    name: Linux watcher regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run watcher hardening tests
        run: cargo test hardening_watcher_ --all-features -- --nocapture
      - name: Exercise automatic local workspace lifecycle
        run: cargo test --locked --all-features --test workspace_live --test workspace_recall

  macos-watcher:
    name: macOS watcher witness
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile macOS-specific watcher path
        run: cargo check --all-features
      - name: Run watcher hardening tests
        run: cargo test hardening_watcher_ --all-features -- --nocapture
      - name: Exercise automatic local workspace lifecycle
        run: cargo test --locked --all-features --test workspace_live --test workspace_recall

  stress:
    name: Stress and recovery smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Generate synthetic repository
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/codanna-hardening"
          mkdir -p "$root/src"
          for i in $(seq 1 5000); do
            printf 'pub fn symbol_%s() -> usize { %s }\n' "$i" "$i" > "$root/src/file_$i.rs"
          done
          echo "$root" > "$RUNNER_TEMP/hardening-root"
      - name: Index synthetic repository
        run: |
          set -euo pipefail
          root="$(cat "$RUNNER_TEMP/hardening-root")"
          /usr/bin/time -v ./target/release/codanna index "$root" 2>"$RUNNER_TEMP/index-metrics.txt"
      - name: Validate indexed repository remains queryable
        run: |
          set -euo pipefail
          root="$(cat "$RUNNER_TEMP/hardening-root")"
          cd "$root"
          "$GITHUB_WORKSPACE/target/release/codanna" retrieve search-symbols query:symbol_4999 limit:5
      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: hardening-metrics-${{ github.run_id }}
          path: ${{ runner.temp }}/index-metrics.txt
          if-no-files-found: error
