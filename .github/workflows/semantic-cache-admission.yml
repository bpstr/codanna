name: Semantic cache admission
on:
  pull_request:
    branches: [fix/semantic-rebuild-reuse]
    paths:
      - 'src/indexing/pipeline/stages/semantic_embed.rs'
      - 'src/semantic/simple.rs'
      - 'tests/semantic_rebuild_reuse.rs'
      - '.github/workflows/semantic-cache-admission.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: semantic-cache-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Refresh native linker artifacts
        run: cargo clean -p ort-sys
      - name: Run rebuild reuse and cache-pressure contracts
        shell: bash
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            rustc --version
            sha256sum src/indexing/pipeline/stages/semantic_embed.rs src/semantic/simple.rs tests/semantic_rebuild_reuse.rs
            cargo test --locked --test semantic_rebuild_reuse -- --nocapture
          } 2>&1 | tee "$RUNNER_TEMP/semantic-cache-admission.log"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check strict lints
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-cache-admission
          path: ${{ runner.temp }}/semantic-cache-admission.log
          retention-days: 14
          if-no-files-found: error
