name: Compact output qualification
on:
  push:
    branches: [codex/compact-budgeted-tool-results]
    paths: [.github/workflows/compact-output-transfer.yml]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Apply exact authored changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, os
          root = pathlib.Path.cwd()
          raw = lzma.decompress(base64.b64decode(''.join((root / f'.github/compact-output-transfer.part{i}').read_text() for i in range(5))))
          assert hashlib.sha256(raw).hexdigest() == 'c5713af696d66d0cbe6f02fffa9a3bd591527aec95891fa8eee1a0a47ff7b691'
          manifest = json.loads(raw)
          allowed = []
          for entry in manifest:
              path = pathlib.Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              before = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(before).hexdigest() == entry['old_sha256'], str(path)
              lines = before.decode().splitlines(keepends=True)
              for start, end, text in reversed(entry['edits']):
                  lines[start:end] = text.splitlines(keepends=True)
              after = ''.join(lines).encode()
              assert hashlib.sha256(after).hexdigest() == entry['new_sha256'], str(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(after)
              allowed.append(str(path))
          pathlib.Path(os.environ['RUNNER_TEMP'], 'compact-paths.json').write_text(json.dumps(allowed))
          print(f'Applied {len(allowed)} hash-verified files')
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-all-crates: true
      - name: Format and publish implementation on the isolated branch
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          allowed = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'compact-paths.json').read_text())
          changed = subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines()
          for path in changed:
              if path not in allowed and path != '.github/workflows/compact-output-transfer.yml':
                  subprocess.run(['git', 'restore', '--', path], check=True)
          subprocess.run(['git', 'add', '--', *allowed], check=True)
          PY
          git rm .github/compact-output-transfer.part* .github/workflows/compact-output-transfer.yml
          git diff --cached --check
          git config user.name 'Fent Jani'
          git config user.email '37303771+bpstr@users.noreply.github.com'
          git commit -m 'Keep search results compact and directly addressable'
          header=$(printf 'x-access-token:%s' "$GH_WRITE_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $header" push origin HEAD:refs/heads/codex/compact-budgeted-tool-results
          git rev-parse HEAD | tee "$RUNNER_TEMP/compact-tested-sha.txt"
      - name: Compile all targets and features
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets --all-features 2>&1 | tee "$RUNNER_TEMP/compact-check.log"
      - name: Execute compact output and compatibility regressions
        shell: bash
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            rustc --version --verbose
            cargo test --locked --lib mcp::output -- --nocapture
            cargo test --locked --test compact_tool_results --test context_limit_diagnostics --test document_retrieval_support --test semantic_fallback_contracts --test symbol_ranking_regressions --test symbol_scope_cli --test ticket_related_cli -- --nocapture
            cargo test --locked --lib semantic_context_preserves_results_when_one_impact_exceeds_budget -- --nocapture
            cargo test --locked --test cli_tests mcp_line_convention -- --nocapture
            cargo test --locked --test cli_tests mcp_exit_code_matrix -- --nocapture
          } 2>&1 | tee "$RUNNER_TEMP/compact-tests.log"
      - name: Strict lint
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/compact-clippy.log"
      - name: Record exact source and patch
        if: always()
        shell: bash
        run: |
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/compact-source.tar.gz"
          git diff 48417cd2039227dc7ab372d3035d8c44e3d31ce3 HEAD > "$RUNNER_TEMP/compact-qualified.patch"
          git rev-parse HEAD > "$RUNNER_TEMP/compact-source-sha.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-output-qualification
          path: |
            ${{ runner.temp }}/compact-*.log
            ${{ runner.temp }}/compact-*.txt
            ${{ runner.temp }}/compact-source.tar.gz
            ${{ runner.temp }}/compact-qualified.patch
          retention-days: 7
