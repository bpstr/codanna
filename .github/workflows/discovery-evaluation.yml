name: Discovery efficiency and repository relevance
on:
  pull_request:
    paths:
      - 'src/storage/tantivy/**'
      - 'tests/repository_task_relevance.rs'
      - 'tests/fixtures/repository_task_sources/**'
      - 'contributing/retrieval/evaluations/repository-tasks.json'
      - '.github/workflows/discovery-evaluation.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: discovery-evaluation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Refresh native linker artifacts
        run: cargo clean -p ort-sys
      - name: Measure frozen tasks and verify ranking compatibility
        shell: bash
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            rustc --version --verbose
            sha256sum src/storage/tantivy/query.rs src/storage/tantivy/ranking_efficiency.rs tests/repository_task_relevance.rs contributing/retrieval/evaluations/repository-tasks.json
            cargo test --locked --test repository_task_relevance -- --nocapture
            cargo test --locked --lib ranking_efficiency -- --nocapture
            cargo test --locked --lib ranking_diagnostics -- --nocapture
            cargo test --locked --test symbol_ranking_regressions --test symbol_ranking_runtime_holdout --test retrieval_ranking_regressions -- --nocapture
            cargo test --locked --test adversarial_regressions search_graph -- --nocapture
            cargo fmt --all -- --check
            cargo clippy --locked --all-targets --all-features -- -D warnings
          } 2>&1 | tee "$RUNNER_TEMP/discovery-evaluation.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-evaluation
          path: ${{ runner.temp }}/discovery-evaluation.log
          retention-days: 14
          if-no-files-found: error
