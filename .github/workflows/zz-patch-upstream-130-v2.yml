name: Apply upstream 130 v2 patch
on:
  push:
    branches: [hardening/upstream-130-buffered-writes-v2]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/upstream-130-buffered-writes-v2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply patch
        run: python .github/scripts/patch-upstream-130.py
      - name: Format and test
        run: |
          cargo fmt --all
          cargo test vector::storage --all-features
      - name: Clean patch scaffolding
        run: rm .github/scripts/patch-upstream-130.py .github/workflows/zz-patch-upstream-130-v2.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "perf: buffer vector payload writes"
          git push origin HEAD:hardening/upstream-130-buffered-writes-v2
