name: Apply upstream 130 v2 patch
on:
  push:
    branches: [hardening/upstream-130-buffered-writes-v2]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/upstream-130-buffered-writes-v2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply focused patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/vector/storage.rs')
          s = p.read_text()
          s = s.replace('use std::io::{self, Write};', 'use std::io::{self, BufWriter, Write};', 1)
          old = """        // Write vectors
        for (id, vector) in vectors {
            // Write vector ID
            file.write_all(&id.to_bytes())?;

            // Write vector data
            for &value in *vector {
                file.write_all(&value.to_le_bytes())?;
            }
        }

        file.flush()?;
"""
          new = """        // Buffer payload writes. A 384-dimensional vector otherwise turns
        // into 385 small write_all calls. Flush before update_metadata() can
        // publish the new header count, preserving the existing crash ordering.
        let mut writer = BufWriter::new(file);
        for (id, vector) in vectors {
            writer.write_all(&id.to_bytes())?;
            for &value in *vector {
                writer.write_all(&value.to_le_bytes())?;
            }
        }
        writer.flush()?;
"""
          if old not in s:
              raise SystemExit('current zero-copy payload block not found')
          p.write_text(s.replace(old, new, 1))
      - name: Format and test vector storage
        run: |
          cargo fmt --all
          cargo test vector::storage --all-features
      - name: Remove one-shot workflow
        run: rm .github/workflows/zz-patch-upstream-130-v2.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/vector/storage.rs .github/workflows/zz-patch-upstream-130-v2.yml
          git commit -m "perf: buffer vector payload writes"
          git push origin HEAD:hardening/upstream-130-buffered-writes-v2
