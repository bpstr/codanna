name: Review security regressions

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Deterministic Rust and plugin regressions
        shell: bash
        run: bash contributing/scripts/review-regressions.sh 2>&1 | tee review-regressions.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-regressions-log
          path: review-regressions.log
          retention-days: 7
