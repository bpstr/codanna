name: Knowledge features
on:
  push:
    branches: ['feature/knowledge-*']
permissions:
  contents: read
concurrency:
  group: knowledge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  knowledge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test knowledge engine and companion CLI
        run: cargo test --locked --bin codanna-knowledge
      - name: CLI entry point
        run: cargo run --locked --bin codanna-knowledge -- --help
      - name: Preserve test logs on failure
        if: failure()
        run: git status --short
