name: Apply upstream 123 patch
on:
  push:
    branches: [hardening/upstream-123-symbol-cache]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/upstream-123-symbol-cache
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply focused patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/indexing/pipeline/types.rs')
          s = p.read_text()
          old = '''        // Load all symbols from Tantivy\n        // Use a large limit to get all symbols\n        let symbols = index\n            .get_all_symbols(1_000_000)\n            .map_err(|e| PipelineError::Index(crate::IndexError::Storage(e)))?;\n\n        for symbol in symbols {\n            cache.insert(symbol);\n        }\n'''
          new = '''        // Visit every symbol row without a fixed result cap. `get_all_symbols`\n        // is a search-oriented API with a caller supplied limit; using it here\n        // silently truncated relationship resolution once an index crossed that\n        // limit. The visitor streams rows directly into the cache and avoids an\n        // intermediate Vec proportional to the whole index.\n        index\n            .for_each_symbol::<crate::storage::StorageError>(|symbol| {\n                cache.insert(symbol);\n                Ok(())\n            })\n            .map_err(|e| PipelineError::Index(crate::IndexError::Storage(e)))?;\n'''
          if old not in s:
              raise SystemExit('expected SymbolLookupCache::from_index block not found')
          p.write_text(s.replace(old, new, 1))

          test = Path('tests/hardening_symbol_cache.rs')
          test.write_text(r'''use codanna::config::Settings;
          use codanna::indexing::pipeline::types::SymbolLookupCache;
          use codanna::storage::DocumentIndex;
          use codanna::{FileId, Range, Symbol, SymbolId, SymbolKind};

          #[test]
          fn hardening_symbol_cache_from_index_visits_every_symbol() {
              let dir = tempfile::tempdir().unwrap();
              let index = DocumentIndex::new(dir.path(), &Settings::default()).unwrap();
              index.start_batch().unwrap();
              for id in 1..=257u32 {
                  let symbol = Symbol::new(
                      SymbolId::new(id).unwrap(),
                      format!("generated_{id}"),
                      SymbolKind::Function,
                      FileId::new(1).unwrap(),
                      Range::new(id, 0, id, 1),
                  );
                  index.add_document(&symbol, "generated.rs").unwrap();
              }
              index.commit_batch().unwrap();

              let cache = SymbolLookupCache::from_index(&index).unwrap();
              assert_eq!(cache.len(), 257);
              assert!(cache.get(SymbolId::new(257).unwrap()).is_some());
          }
          ''')
      - name: Format
        run: cargo fmt --all
      - name: Remove one-shot workflow
        run: rm .github/workflows/zz-patch-upstream-123.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/indexing/pipeline/types.rs tests/hardening_symbol_cache.rs .github/workflows/zz-patch-upstream-123.yml
          git commit -m "fix: remove million-symbol relationship cache cap"
          git push origin HEAD:hardening/upstream-123-symbol-cache
