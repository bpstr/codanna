name: Apply vector write hardening patch
on:
  push:
    branches: [hardening/vector-write-path]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/vector-write-path
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply focused patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/vector/storage.rs')
          s = p.read_text()
          s = s.replace('use std::io::{self, Write};', 'use std::io::{self, BufWriter, Write};', 1)
          old = '''        // Convert to owned for validation and writing\n        let owned_vectors: Vec<(VectorId, Vec<f32>)> = vectors\n            .iter()\n            .map(|(id, vec)| (*id, vec.to_vec()))\n            .collect();\n        self.validate_vectors(&owned_vectors)?;\n        self.ensure_storage_ready()?;\n        // Drop the map before any file write: mutating a mapped file is\n        // undefined behavior per the memmap2 contract. The next read remaps.\n        self.invalidate_cache();\n        self.append_vectors(&owned_vectors)?;\n        self.update_metadata(vectors.len())?;\n'''
          new = '''        // Validate and write directly from borrowed vectors. Do not materialize\n        // a second full batch: semantic snapshots can contain hundreds of\n        // thousands of vectors, so cloning here creates an avoidable O(index)\n        // memory spike exactly when persistence is already under pressure.\n        self.validate_vectors(vectors)?;\n        self.ensure_storage_ready()?;\n        // Drop the map before any file write: mutating a mapped file is\n        // undefined behavior per the memmap2 contract. The next read remaps.\n        self.invalidate_cache();\n        self.append_vectors(vectors)?;\n        self.update_metadata(vectors.len())?;\n'''
          if old not in s:
              raise SystemExit('write_batch block not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              'fn validate_vectors(&self, vectors: &[(VectorId, Vec<f32>)]) -> Result<(), VectorStorageError> {',
              'fn validate_vectors(&self, vectors: &[(VectorId, &[f32])]) -> Result<(), VectorStorageError> {',
              1,
          )
          old_append = '''    fn append_vectors(&self, vectors: &[(VectorId, Vec<f32>)]) -> Result<(), VectorStorageError> {\n        debug_assert!(\n            self.mmap.is_none(),\n            "file must not be written while mapped (memmap2 UB)"\n        );\n        let mut file = OpenOptions::new()\n            .create(true)\n            .append(true)\n            .open(&self.path)?;\n\n        // Write header if this is a new file\n        if file.metadata()?.len() == 0 {\n            self.write_header(&mut file)?;\n        }\n\n        // Write vectors\n        for (id, vector) in vectors {\n            // Write vector ID\n            file.write_all(&id.to_bytes())?;\n\n            // Write vector data\n            for &value in vector {\n                file.write_all(&value.to_le_bytes())?;\n            }\n        }\n\n        file.flush()?;\n        Ok(())\n    }\n'''
          new_append = '''    fn append_vectors(&self, vectors: &[(VectorId, &[f32])]) -> Result<(), VectorStorageError> {\n        debug_assert!(\n            self.mmap.is_none(),\n            "file must not be written while mapped (memmap2 UB)"\n        );\n        let mut file = OpenOptions::new()\n            .create(true)\n            .append(true)\n            .open(&self.path)?;\n\n        // Write header if this is a new file before wrapping the append handle.\n        if file.metadata()?.len() == 0 {\n            self.write_header(&mut file)?;\n        }\n\n        // Buffer the payload so a 384-dimensional vector does not turn into\n        // hundreds of tiny write syscalls. Flush before returning: the caller\n        // updates the header count only after this function succeeds.\n        let mut writer = BufWriter::new(file);\n        for (id, vector) in vectors {\n            writer.write_all(&id.to_bytes())?;\n            for &value in *vector {\n                writer.write_all(&value.to_le_bytes())?;\n            }\n        }\n        writer.flush()?;\n        Ok(())\n    }\n'''
          if old_append not in s:
              raise SystemExit('append_vectors block not found')
          p.write_text(s.replace(old_append, new_append, 1))
      - name: Format
        run: cargo fmt --all
      - name: Remove one-shot workflow
        run: rm .github/workflows/zz-patch-vector-write.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/vector/storage.rs .github/workflows/zz-patch-vector-write.yml
          git commit -m "perf: harden and buffer vector persistence"
          git push origin HEAD:hardening/vector-write-path
