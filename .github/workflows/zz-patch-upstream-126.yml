name: Apply upstream 126 patch
on:
  push:
    branches: [hardening/upstream-126-macos-watcher]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/upstream-126-macos-watcher
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply focused patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/watcher/unified.rs')
          s = p.read_text()

          old = '''        // Watch all directories\n        for dir in new_dirs {\n            self.watch_directory(&dir)?;\n        }\n\n        self.register_handler_roots().await;\n'''
          new = '''        // FSEvents restarts its stream whenever a non-recursive path is added\n        // and has a practical path-count ceiling. On macOS the registered\n        // handler roots below are watched recursively, so thousands of\n        // individual directory registrations are both redundant and harmful.\n        #[cfg(not(target_os = "macos"))]\n        for dir in new_dirs {\n            self.watch_directory(&dir)?;\n        }\n        #[cfg(target_os = "macos")]\n        let _ = new_dirs;\n\n        self.register_handler_roots().await;\n'''
          if old not in s:
              raise SystemExit('startup watch loop not found')
          s = s.replace(old, new, 1)

          marker = '''    /// Handle an incoming file event.\n'''
          helper = '''    /// Register a handler root. macOS uses one recursive FSEvents root\n    /// instead of thousands of NonRecursive paths; other platforms retain the\n    /// existing per-directory strategy.\n    fn watch_handler_root(&mut self, root: &PathBuf) -> Result<(), WatchError> {\n        #[cfg(target_os = "macos")]\n        {\n            let watch_path = if root.is_absolute() {\n                root.clone()\n            } else {\n                self.workspace_root.join(root)\n            };\n            match self._watcher.watch(&watch_path, RecursiveMode::Recursive) {\n                Ok(_) => Ok(()),\n                Err(e) => {\n                    tracing::warn!(\n                        "[watcher] failed to watch recursive root {}: {e}",\n                        crate::parsing::paths::render_absolute_path(&watch_path).display()\n                    );\n                    Ok(())\n                }\n            }\n        }\n        #[cfg(not(target_os = "macos"))]\n        {\n            self.watch_directory(root)\n        }\n    }\n\n'''
          if marker not in s:
              raise SystemExit('watch helper marker not found')
          s = s.replace(marker, helper + marker, 1)

          s = s.replace(
              'if let Err(e) = self.watch_directory(root) {\n                    tracing::warn!("[watcher] failed to watch root: {e}");\n                }',
              'if let Err(e) = self.watch_handler_root(root) {\n                    tracing::warn!("[watcher] failed to watch root: {e}");\n                }',
              1,
          )

          old_dirs = '''        for dir in dirs {\n            if self.registry.add_watch_dir(dir.clone()) {\n                if let Err(e) = self.watch_directory(&dir) {\n                    tracing::warn!("[watcher] failed to watch created dir: {e}");\n                }\n            }\n        }\n'''
          new_dirs = '''        for dir in dirs {\n            if self.registry.add_watch_dir(dir.clone()) {\n                #[cfg(not(target_os = "macos"))]\n                if let Err(e) = self.watch_directory(&dir) {\n                    tracing::warn!("[watcher] failed to watch created dir: {e}");\n                }\n                // macOS recursive handler-root watches already cover the new\n                // subtree; registry membership is still tracked for routing.\n            }\n        }\n'''
          if old_dirs not in s:
              raise SystemExit('created-directory watch loop not found')
          s = s.replace(old_dirs, new_dirs, 1)

          old_reload = '''        // Watch any new directories\n        for dir in dirs_to_watch {\n            if let Err(e) = self.watch_directory(&dir) {\n                tracing::warn!("[watcher] failed to watch new directory: {e}");\n            }\n        }\n\n        // Config reload can add or drop roots; re-register them.\n'''
          new_reload = '''        // Watch any new directories. Recursive handler-root watches already\n        // cover them on macOS.\n        #[cfg(not(target_os = "macos"))]\n        for dir in dirs_to_watch {\n            if let Err(e) = self.watch_directory(&dir) {\n                tracing::warn!("[watcher] failed to watch new directory: {e}");\n            }\n        }\n        #[cfg(target_os = "macos")]\n        let _ = dirs_to_watch;\n\n        // Config reload can add or drop roots; re-register them.\n'''
          if old_reload not in s:
              raise SystemExit('reload watch loop not found')
          p.write_text(s.replace(old_reload, new_reload, 1))
      - name: Format and Linux compile
        run: |
          cargo fmt --all
          cargo check --all-features
      - name: Remove one-shot workflow
        run: rm .github/workflows/zz-patch-upstream-126.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/watcher/unified.rs .github/workflows/zz-patch-upstream-126.yml
          git commit -m "fix: use recursive handler-root watches on macOS"
          git push origin HEAD:hardening/upstream-126-macos-watcher
