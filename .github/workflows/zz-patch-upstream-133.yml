name: Apply upstream 133 patch
on:
  push:
    branches: [hardening/upstream-133-stdio-shutdown]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/upstream-133-stdio-shutdown
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply focused patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/cli/commands/serve.rs')
          s = p.read_text()
          marker = '    // If watch mode is enabled, start the hot-reload watcher\n'
          insert = '''    // Stdio-owned background work must end with the transport. Detached\n    // watcher tasks can otherwise survive an EOF long enough to keep the\n    // notify backend busy and retain serve.lock during event bursts.\n    let mut background_tasks: Vec<tokio::task::JoinHandle<()>> = Vec::new();\n\n'''
          if marker not in s:
              raise SystemExit('background task insertion marker not found')
          s = s.replace(marker, insert + marker, 1)
          old = '''        // Spawn watcher in background\n        tokio::spawn(async move {\n            watcher.watch().await;\n        });\n'''
          new = '''        // Spawn watcher in background, owned by the stdio session.\n        background_tasks.push(tokio::spawn(async move {\n            watcher.watch().await;\n        }));\n'''
          if old not in s:
              raise SystemExit('hot reload spawn not found')
          s = s.replace(old, new, 1)
          old = '''                tokio::spawn(async move {\n                    if let Err(e) = unified_watcher.watch().await {\n                        eprintln!("Unified watcher error: {e}");\n                    }\n                });\n'''
          new = '''                background_tasks.push(tokio::spawn(async move {\n                    if let Err(e) = unified_watcher.watch().await {\n                        eprintln!("Unified watcher error: {e}");\n                    }\n                }));\n'''
          if old not in s:
              raise SystemExit('unified watcher spawn not found')
          s = s.replace(old, new, 1)
          old = '''                tokio::spawn(async move {\n                    notification_server\n                        .start_notification_listener(notification_receiver)\n                        .await;\n                });\n'''
          new = '''                background_tasks.push(tokio::spawn(async move {\n                    notification_server\n                        .start_notification_listener(notification_receiver)\n                        .await;\n                }));\n'''
          if old not in s:
              raise SystemExit('notification listener spawn not found')
          s = s.replace(old, new, 1)
          old = '''    // Wait for server to complete\n    if let Err(e) = service.waiting().await {\n        eprintln!("MCP server error: {e}");\n        drop(serve_lock);\n        std::process::exit(1);\n    }\n'''
          new = '''    // Wait for the stdio transport, then synchronously tear down all work\n    // owned by that session before releasing serve.lock. `abort` is sufficient\n    // for these async loops because the native notify watcher is owned inside\n    // the task and drops when the future is cancelled.\n    let service_result = service.waiting().await;\n    for task in &background_tasks {\n        task.abort();\n    }\n    for task in background_tasks {\n        let _ = task.await;\n    }\n\n    if let Err(e) = service_result {\n        eprintln!("MCP server error: {e}");\n        drop(serve_lock);\n        std::process::exit(1);\n    }\n'''
          if old not in s:
              raise SystemExit('service waiting block not found')
          p.write_text(s.replace(old, new, 1))
      - name: Format and compile
        run: |
          cargo fmt --all
          cargo check --all-features
      - name: Remove one-shot workflow
        run: rm .github/workflows/zz-patch-upstream-133.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/cli/commands/serve.rs .github/workflows/zz-patch-upstream-133.yml
          git commit -m "fix: stop stdio watcher tasks when transport closes"
          git push origin HEAD:hardening/upstream-133-stdio-shutdown
