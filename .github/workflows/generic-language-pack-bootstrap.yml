name: Generic language pack bootstrap
on:
  push:
    branches: ['feature/generic-language-pack']
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/generic-language-pack
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Wire generic language fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('Cargo.toml')
          s = p.read_text()
          needle = 'tree-sitter-bash = "0.25.1"\n'
          if 'tree-sitter-language-pack' not in s:
              if needle not in s:
                  raise SystemExit('Cargo tree-sitter insertion point missing')
              s = s.replace(needle, needle + 'tree-sitter-language-pack = "=1.16.2"\n')
          p.write_text(s)

          p = Path('src/parsing/mod.rs')
          s = p.read_text()
          if 'pub mod generic_pack;' not in s:
              marker = 'pub mod factory;\n'
              if marker not in s:
                  raise SystemExit('parsing mod insertion point missing')
              s = s.replace(marker, marker + 'pub mod generic_pack;\n')
          p.write_text(s)

          p = Path('src/indexing/pipeline/stages/parse.rs')
          s = p.read_text()
          s = s.replace(
              '    LanguageBehavior, LanguageId, LanguageParser, get_registry, normalize_for_module_path,\n',
              '    LanguageBehavior, LanguageId, LanguageParser, generic_pack, get_registry,\n    normalize_for_module_path,\n'
          )
          old = '''fn detect_language(path: &Path) -> PipelineResult<LanguageId> {\n    let extension = path.extension().and_then(|ext| ext.to_str()).unwrap_or("");\n\n    let registry = get_registry();\n    let registry = registry.lock().map_err(|e| PipelineError::Parse {\n        path: path.to_path_buf(),\n        reason: format!("Failed to acquire registry lock: {e}"),\n    })?;\n\n    registry\n        .get_by_extension(extension)\n        .map(|def| def.id())\n        .ok_or_else(|| PipelineError::UnsupportedFileType {\n            path: path.to_path_buf(),\n        })\n}\n'''
          new = '''fn detect_language(path: &Path, settings: &Settings) -> PipelineResult<LanguageId> {\n    let extension = path.extension().and_then(|ext| ext.to_str()).unwrap_or("");\n\n    {\n        let registry = get_registry();\n        let registry = registry.lock().map_err(|e| PipelineError::Parse {\n            path: path.to_path_buf(),\n            reason: format!("Failed to acquire registry lock: {e}"),\n        })?;\n        if let Some(definition) = registry.get_by_extension(extension) {\n            if definition.is_enabled(settings) {\n                return Ok(definition.id());\n            }\n            return Err(PipelineError::UnsupportedFileType {\n                path: path.to_path_buf(),\n            });\n        }\n    }\n\n    generic_pack::detect_path(path, settings).ok_or_else(|| PipelineError::UnsupportedFileType {\n        path: path.to_path_buf(),\n    })\n}\n\nfn is_registered_language(language_id: LanguageId) -> PipelineResult<bool> {\n    let registry = get_registry();\n    let registry = registry.lock().map_err(|e| PipelineError::Parse {\n        path: Default::default(),\n        reason: format!("Failed to acquire registry lock: {e}"),\n    })?;\n    Ok(registry.get(language_id).is_some())\n}\n'''
          if old not in s:
              raise SystemExit('detect_language block changed unexpectedly')
          s = s.replace(old, new)
          s = s.replace('let Ok(language_id) = detect_language(path) else {', 'let Ok(language_id) = detect_language(path, settings) else {')
          old = '''        if seen.insert(language_id) {\n            create_parser(language_id, settings)?;\n        }\n'''
          new = '''        if seen.insert(language_id) {\n            if is_registered_language(language_id)? {\n                create_parser(language_id, settings)?;\n            } else {\n                generic_pack::prewarm(language_id)?;\n            }\n        }\n'''
          if old not in s:
              raise SystemExit('preflight block changed unexpectedly')
          s = s.replace(old, new)
          s = s.replace('let language_id = detect_language(&content.path)?;', 'let language_id = detect_language(&content.path, settings)?;')
          legacy_test_call = 'let result = detect_language(path);'
          if s.count(legacy_test_call) != 3:
              raise SystemExit(f'expected 3 legacy detect_language test calls, found {s.count(legacy_test_call)}')
          s = s.replace(legacy_test_call, 'let result = detect_language(path, &Settings::default());')
          old = '''    PARSER_CACHE.with(|cache| {\n        let mut cache_ref = cache.borrow_mut();\n        let parser_cache = cache_ref\n            .as_mut()\n            .expect("Parser cache not initialized. Call init_parser_cache first.");\n\n        let parser = parser_cache.get_or_create(language_id)?;\n\n        parse_with_parser(content, language_id, parser, settings, module_root)\n    })\n'''
          new = '''    if !is_registered_language(language_id)? {\n        return generic_pack::parse(\n            content.path,\n            content.hash,\n            &content.content,\n            language_id,\n            module_root,\n        );\n    }\n\n    PARSER_CACHE.with(|cache| {\n        let mut cache_ref = cache.borrow_mut();\n        let parser_cache = cache_ref\n            .as_mut()\n            .expect("Parser cache not initialized. Call init_parser_cache first.");\n\n        let parser = parser_cache.get_or_create(language_id)?;\n\n        parse_with_parser(content, language_id, parser, settings, module_root)\n    })\n'''
          if old not in s:
              raise SystemExit('parse dispatch block changed unexpectedly')
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('src/indexing/walker.rs')
          s = p.read_text()
          s = s.replace('use crate::parsing::get_registry;', 'use crate::parsing::{generic_pack, get_registry};')
          old = '''        // Build and filter the walker\n        Self::configured_builder(root)\n            .build()\n'''
          new = '''        // Build and filter the walker. Generic language detection is a pure table lookup.\n        let settings = self.settings.clone();\n        Self::configured_builder(root)\n            .build()\n'''
          if old not in s:
              raise SystemExit('walker setup block changed unexpectedly')
          s = s.replace(old, new)
          old = '''                // Check if this file extension is enabled\n                if let Some(extension) = path.extension() {\n                    if let Some(ext_str) = extension.to_str() {\n                        if enabled_extensions.iter().any(|ext| ext == ext_str) {\n                            return Some(path.to_path_buf());\n                        }\n                    }\n                }\n\n                None\n'''
          new = '''                if let Some(extension) = path.extension() {\n                    if let Some(ext_str) = extension.to_str() {\n                        if enabled_extensions.iter().any(|ext| ext == ext_str) {\n                            return Some(path.to_path_buf());\n                        }\n                    }\n                }\n\n                generic_pack::detect_path(path, &settings).map(|_| path.to_path_buf())\n'''
          if old not in s:
              raise SystemExit('walker extension block changed unexpectedly')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Refresh lockfile and validate broad tier
        run: |
          cargo check --all-targets --all-features
          cargo test generic_pack --lib
          cargo fmt --all
          cargo clippy --all-targets --all-features -- -D warnings
      - name: Commit generated integration
        run: |
          rm .github/workflows/generic-language-pack-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.toml Cargo.lock src/parsing src/indexing .github/workflows/generic-language-pack-bootstrap.yml
          git commit -m 'feat(parsing): wire 371-language generic syntax tier'
          git push origin HEAD:feature/generic-language-pack
