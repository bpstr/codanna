name: Apply non-finite semantic hardening v2
on:
  push:
    branches: [hardening/non-finite-semantic-vectors-v2]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/non-finite-semantic-vectors-v2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply patch
        run: python .github/scripts/patch-nonfinite.py
      - name: Format and test
        run: |
          cargo fmt --all
          cargo test semantic::simple --all-features -- --nocapture
          cargo check --all-features
      - name: Clean patch scaffolding
        run: rm .github/scripts/patch-nonfinite.py .github/workflows/zz-patch-nonfinite-v2.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "hardening: reject non-finite semantic vectors"
          git push origin HEAD:hardening/non-finite-semantic-vectors-v2
