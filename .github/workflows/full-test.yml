name: Full Test Suite
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: full-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-all-crates: true
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy with project rules
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Check no-default-features
        run: cargo check --locked --no-default-features
      - name: Run default-feature tests
        run: cargo test --locked --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/default-tests.log"
      - name: Run all-feature tests
        run: cargo test --locked --all-features --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/all-feature-tests.log"
      - name: Verify CLI commands
        run: |
          ./target/debug/codanna --help
          ./target/debug/codanna index --help
          ./target/debug/codanna retrieve --help
      - name: Check docs build
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-rust-test-logs
          path: |
            ${{ runner.temp }}/default-tests.log
            ${{ runner.temp }}/all-feature-tests.log
          retention-days: 7
          if-no-files-found: ignore

  # Windows is exercised separately in windows-witness.yml.
  release-check:
    name: Release Build Check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          cache-on-failure: true
      - name: Build release binary
        run: cargo build --locked --release
      - name: Check binary size
        run: |
          ls -lh target/release/codanna
          size=$(stat -c%s target/release/codanna)
          echo "Binary size: $size bytes"
          if [ "$size" -gt 50000000 ]; then
            echo "::warning::Binary larger than 50MB"
          fi
