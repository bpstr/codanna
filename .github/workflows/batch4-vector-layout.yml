name: Batch 4 vector layout patch

on:
  push:
    branches:
      - hardening/vector-physical-layout

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/vector-physical-layout
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply physical layout validation
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/vector/storage.rs")
          s = path.read_text()
          if "fn validate_physical_layout(" not in s:
              open_old = '''        if version != STORAGE_VERSION {\n            return Err(VectorError::VersionMismatch {\n                expected: STORAGE_VERSION,\n                actual: version,\n            }\n            .into());\n        }\n\n        Ok(Self {\n'''
              open_new = '''        if version != STORAGE_VERSION {\n            return Err(VectorError::VersionMismatch {\n                expected: STORAGE_VERSION,\n                actual: version,\n            }\n            .into());\n        }\n\n        Self::validate_physical_layout(&mmap, dimension, vector_count)?;\n\n        Ok(Self {\n'''
              if open_old not in s:
                  raise SystemExit("open validation marker missing")
              s = s.replace(open_old, open_new, 1)

              mapped_old = '''            // Update vector count from file\n            let (_, _, count) = Self::read_header(&mmap)?;\n            self.vector_count = count;\n            self.mmap = Some(mmap);\n'''
              mapped_new = '''            // Update vector count from file only after verifying the header describes\n            // exactly the bytes that are physically present.\n            let (_, dimension, count) = Self::read_header(&mmap)?;\n            if dimension != self.dimension {\n                return Err(VectorStorageError::InvalidFormat(format!(\n                    "Vector dimension changed on disk: expected {}, found {}",\n                    self.dimension.get(),\n                    dimension.get()\n                )));\n            }\n            Self::validate_physical_layout(&mmap, dimension, count)?;\n            self.vector_count = count;\n            self.mmap = Some(mmap);\n'''
              if mapped_old not in s:
                  raise SystemExit("ensure_mapped marker missing")
              s = s.replace(mapped_old, mapped_new, 1)

              marker = '''    fn update_header_count(&self) -> Result<(), VectorStorageError> {\n'''
              helper = '''    fn validate_physical_layout(\n        mmap: &Mmap,\n        dimension: VectorDimension,\n        vector_count: usize,\n    ) -> Result<(), VectorStorageError> {\n        let payload_bytes = dimension\n            .get()\n            .checked_mul(BYTES_PER_F32)\n            .and_then(|bytes| bytes.checked_add(BYTES_PER_ID))\n            .ok_or_else(|| {\n                VectorStorageError::InvalidFormat(\n                    "Vector record size overflows address space".to_string(),\n                )\n            })?;\n        let expected = vector_count\n            .checked_mul(payload_bytes)\n            .and_then(|bytes| bytes.checked_add(HEADER_SIZE))\n            .ok_or_else(|| {\n                VectorStorageError::InvalidFormat(\n                    "Vector file size overflows address space".to_string(),\n                )\n            })?;\n\n        if mmap.len() != expected {\n            return Err(VectorStorageError::InvalidFormat(format!(\n                "Vector file is inconsistent: header expects {expected} bytes, file contains {} bytes",\n                mmap.len()\n            )));\n        }\n\n        Ok(())\n    }\n\n'''
              if marker not in s:
                  raise SystemExit("layout helper marker missing")
              s = s.replace(marker, helper + marker, 1)

              test_marker = '''    #[test]\n    fn test_write_after_read_drops_map_before_writing() {\n'''
              tests = '''    #[test]\n    fn hardening_open_rejects_truncated_vector_file() {\n        let temp_dir = TempDir::new().unwrap();\n        let segment = SegmentOrdinal::new(0);\n        let dimension = VectorDimension::new(2).unwrap();\n        let mut storage = MmapVectorStorage::open_or_create(&temp_dir, segment, dimension).unwrap();\n        let data = [(VectorId::new(1).unwrap(), vec![1.0f32, 2.0])];\n        let refs: Vec<(VectorId, &[f32])> = data\n            .iter()\n            .map(|(id, vector)| (*id, vector.as_slice()))\n            .collect();\n        storage.write_batch(&refs).unwrap();\n        drop(storage);\n\n        let path = temp_dir.path().join("segment_0.vec");\n        let file = OpenOptions::new().write(true).open(path).unwrap();\n        let len = file.metadata().unwrap().len();\n        file.set_len(len - 1).unwrap();\n\n        let err = MmapVectorStorage::open(&temp_dir, segment)\n            .expect_err("truncated vector file must be rejected");\n        assert!(err.to_string().contains("inconsistent"));\n    }\n\n    #[test]\n    fn hardening_open_rejects_orphan_vector_tail() {\n        let temp_dir = TempDir::new().unwrap();\n        let segment = SegmentOrdinal::new(0);\n        let dimension = VectorDimension::new(2).unwrap();\n        let mut storage = MmapVectorStorage::open_or_create(&temp_dir, segment, dimension).unwrap();\n        let data = [(VectorId::new(1).unwrap(), vec![1.0f32, 2.0])];\n        let refs: Vec<(VectorId, &[f32])> = data\n            .iter()\n            .map(|(id, vector)| (*id, vector.as_slice()))\n            .collect();\n        storage.write_batch(&refs).unwrap();\n        drop(storage);\n\n        let path = temp_dir.path().join("segment_0.vec");\n        let mut file = OpenOptions::new().append(true).open(path).unwrap();\n        file.write_all(&VectorId::new(2).unwrap().to_bytes()).unwrap();\n        file.write_all(&3.0f32.to_le_bytes()).unwrap();\n        file.write_all(&4.0f32.to_le_bytes()).unwrap();\n        file.flush().unwrap();\n\n        let err = MmapVectorStorage::open(&temp_dir, segment)\n            .expect_err("unpublished appended vector must be rejected");\n        assert!(err.to_string().contains("inconsistent"));\n    }\n\n    #[test]\n    fn hardening_open_rejects_header_count_beyond_file() {\n        use std::io::{Seek, SeekFrom};\n\n        let temp_dir = TempDir::new().unwrap();\n        let segment = SegmentOrdinal::new(0);\n        let dimension = VectorDimension::new(2).unwrap();\n        let mut storage = MmapVectorStorage::open_or_create(&temp_dir, segment, dimension).unwrap();\n        let data = [(VectorId::new(1).unwrap(), vec![1.0f32, 2.0])];\n        let refs: Vec<(VectorId, &[f32])> = data\n            .iter()\n            .map(|(id, vector)| (*id, vector.as_slice()))\n            .collect();\n        storage.write_batch(&refs).unwrap();\n        drop(storage);\n\n        let path = temp_dir.path().join("segment_0.vec");\n        let mut file = OpenOptions::new().write(true).open(path).unwrap();\n        file.seek(SeekFrom::Start(12)).unwrap();\n        file.write_all(&u32::MAX.to_le_bytes()).unwrap();\n        file.flush().unwrap();\n\n        let err = MmapVectorStorage::open(&temp_dir, segment)\n            .expect_err("impossible header count must be rejected");\n        assert!(err.to_string().contains("inconsistent"));\n    }\n\n'''
              if test_marker not in s:
                  raise SystemExit("layout test marker missing")
              s = s.replace(test_marker, tests + test_marker, 1)
              path.write_text(s)
      - name: Format and test vector storage
        run: |
          cargo fmt --all -- --check || cargo fmt --all
          cargo test vector::storage::tests::hardening_open --lib
          cargo test vector::storage::tests --lib
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vector/storage.rs
          git commit -m "hardening: validate vector storage physical layout"
          git push origin HEAD:hardening/vector-physical-layout
