name: Scoped ticket relevance
on:
  push:
    branches: [integration/scoped-ticket-relevance]
  pull_request:
    branches: [feature/ticket-related-implementations]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'contributing/scripts/check-scoped-ticket-relevance.py'
      - 'contributing/retrieval/scoped-ticket-relevance.md'
      - 'contributing/retrieval/evaluations/repository-tasks.json'
      - '.github/workflows/scoped-ticket-relevance.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scoped-ticket-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Refresh native linker artifacts
        run: cargo clean -p ort-sys
      - name: Verify committed scoped evidence and combined relevance
        shell: bash
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            rustc --version --verbose
            sha256sum src/storage/tantivy/graph.rs src/storage/tantivy/graph_scope.rs src/storage/tantivy/query.rs src/storage/tantivy/scope.rs src/storage/tantivy/linguistic_coverage.rs src/mcp/tools/ticket_related.rs tests/scoped_ticket_related.rs tests/ticket_related_relevance.rs contributing/retrieval/evaluations/repository-tasks.json
            cargo test --locked --test scoped_ticket_related --test ticket_related_relevance --test repository_task_relevance --test scoped_search_snapshots --test symbol_path_scope --test symbol_scope_cli --test ticket_related_cli --test symbol_ranking_regressions --test symbol_ranking_runtime_holdout -- --nocapture
            for filter in ticket_related ticket_code_fusion scoped_graph scope_snapshot scope_inventory scope_cache linguistic_coverage ranking_efficiency; do
              cargo test --locked --lib "$filter" -- --list | tee "$RUNNER_TEMP/selected-$filter.txt"
              grep -Eq ': test$' "$RUNNER_TEMP/selected-$filter.txt"
              cargo test --locked --lib "$filter" -- --nocapture
            done
            cargo test --locked --test workspace_mcp ticket_code_fusion -- --nocapture
            cargo test --locked --lib hardening_final_tool_catalog_matches_generated_schemas_and_guidance -- --nocapture
          } 2>&1 | tee "$RUNNER_TEMP/scoped-ticket-relevance.log"
      - name: Verify all frozen outcomes without claiming the quality target
        shell: bash
        run: python3 contributing/scripts/check-scoped-ticket-relevance.py "$RUNNER_TEMP/scoped-ticket-relevance.log" | tee "$RUNNER_TEMP/scoped-ticket-summary.json"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check strict lints
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoped-ticket-relevance
          path: |
            ${{ runner.temp }}/scoped-ticket-relevance.log
            ${{ runner.temp }}/scoped-ticket-summary.json
            ${{ runner.temp }}/selected-*.txt
          retention-days: 14
          if-no-files-found: error
