name: Review final checks

on:
  push:
    branches: [work/review-20260912]
    paths: [.github/workflows/review-final-check.yml]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preserve source change manifest
        run: cp review.final2.b64 "$RUNNER_TEMP/changes.b64"
      - uses: actions/checkout@v6
        with:
          ref: acbc9470c2f6e211975d2cd89cf4e16c07196166
          persist-credentials: false
      - name: Apply verified changes
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          encoded = Path(os.environ['RUNNER_TEMP'], 'changes.b64').read_bytes()
          raw = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest() == 'd233403ccad2d028fb063d663b77169b79d41b4ff9c752b9311ea151986f9e33'
          prepared = []
          for change in json.loads(raw):
              path = Path(change['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              old = path.read_bytes() if path.exists() else b''
              assert (not path.exists()) if change['old'] is None else hashlib.sha256(old).hexdigest() == change['old']
              lines = old.decode().splitlines(keepends=True)
              for first, last, replacement in reversed(change['edits']):
                  lines[first:last] = replacement.splitlines(keepends=True)
              new = ''.join(lines).encode()
              assert hashlib.sha256(new).hexdigest() == change['new'], str(path)
              prepared.append((path,new))
          for path, new in prepared:
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(new)
          Path(os.environ['RUNNER_TEMP'],'changed-rust.txt').write_text('\n'.join(str(p) for p,_ in prepared if p.suffix == '.rs'))
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: review-final
          cache-on-failure: true
          cache-workspace-crates: false
      - name: Format and verify actual source
        run: |
          xargs -d '\n' rustfmt --edition 2024 --config skip_children=true < "$RUNNER_TEMP/changed-rust.txt"
          git add -N .
          git diff --check
          cargo clean -p codanna
      - name: Full Rust tests with locked dependencies
        run: cargo test --locked --all-features 2>&1 | tee "$RUNNER_TEMP/full-tests.log"
      - name: Strict Clippy
        if: ${{ !cancelled() && success() }}
        run: cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: No default features
        if: ${{ !cancelled() && success() }}
        run: cargo check --locked --no-default-features 2>&1 | tee "$RUNNER_TEMP/no-default.log"
      - name: Export candidate
        if: always()
        run: |
          git add -N .
          git diff --binary > "$RUNNER_TEMP/candidate.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-final-checks
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/candidate.patch
            ${{ runner.temp }}/changes.b64
          retention-days: 3
