name: Review final checks

on:
  push:
    branches: [work/review-20260912]
    paths:
      - .github/workflows/review-final-check.yml
      - 'review.final*.py'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preserve verified source manifests
        run: cp review.final*.b64 review.final*.py "$RUNNER_TEMP/"
      - uses: actions/checkout@v6
        with:
          ref: acbc9470c2f6e211975d2cd89cf4e16c07196166
          persist-credentials: false
      - name: Apply verified changes
        run: |
          python3 "$RUNNER_TEMP/review.final-driver.py"
          if [[ -f "$RUNNER_TEMP/review.final-adjust.py" ]]; then
            python3 "$RUNNER_TEMP/review.final-adjust.py"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: review-final
          cache-on-failure: true
          cache-workspace-crates: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Format and verify actual source
        run: |
          cargo fmt --all
          git add -N .
          git diff --check
          cargo clean -p codanna
      - name: Full Rust tests with locked dependencies
        run: cargo test --locked --all-features --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/full-tests.log"
      - name: Strict Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: No default features
        if: ${{ !cancelled() }}
        run: cargo check --locked --no-default-features 2>&1 | tee "$RUNNER_TEMP/no-default.log"
      - name: Documentation
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features 2>&1 | tee "$RUNNER_TEMP/docs.log"
      - name: Plugin regressions
        if: ${{ !cancelled() }}
        run: node --test tests/security/*.test.cjs 2>&1 | tee "$RUNNER_TEMP/node.log"
      - name: Export candidate
        if: always()
        run: |
          git add -N .
          git diff --binary > "$RUNNER_TEMP/candidate.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-final-checks
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/candidate.patch
            ${{ runner.temp }}/review.final*.b64
          retention-days: 3
