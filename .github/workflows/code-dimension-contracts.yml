name: Code dimension contracts
on:
  pull_request:
    branches: [integration/body-cache-reuse]
    paths:
      - 'src/**'
      - 'tests/code_dimension_contract.rs'
      - 'tests/semantic_rebuild_reuse.rs'
      - 'tests/index_plan_cli.rs'
      - 'tests/body_index_plan_cli.rs'
      - 'tests/cli/test_index_force_invalid_path.rs'
      - 'tests/cli/test_emission_version_gate.rs'
      - 'contributing/retrieval/code-embedding-dimensions*'
      - '.github/workflows/code-dimension-contracts.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: code-dimensions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Refresh native linker artifacts
        run: cargo clean -p ort-sys
      - name: Verify committed dimension, rebuild and planner contracts
        shell: bash
        run: |
          set -euo pipefail
          unset CODANNA_EMBED_URL CODANNA_EMBED_DIM CODANNA_EMBED_MODEL CODANNA_EMBED_API_KEY
          {
            git rev-parse HEAD
            rustc --version --verbose
            sha256sum tests/code_dimension_contract.rs src/semantic/code_dimension.rs src/semantic/journal.rs src/indexing/facade.rs src/rebuild_plan.rs src/main.rs
            cargo test --locked --test code_dimension_contract --test semantic_rebuild_reuse --test index_plan_cli --test body_index_plan_cli -- --nocapture
            for target in code_dimension_contract rebuild_plan::tests symbol_representation semantic::journal::tests config::; do
              cargo test --locked --lib "$target" -- --list > "$RUNNER_TEMP/dimension-selected.txt"
              grep -Eq ': test$' "$RUNNER_TEMP/dimension-selected.txt"
              cargo test --locked --lib "$target" -- --nocapture
            done
          } 2>&1 | tee "$RUNNER_TEMP/code-dimension-contracts.log"
      - name: Verify existing CLI force and emission-version gates
        shell: bash
        run: |
          set -euo pipefail
          unset CODANNA_EMBED_URL CODANNA_EMBED_DIM CODANNA_EMBED_MODEL CODANNA_EMBED_API_KEY
          {
            for target in test_index_force_invalid_path test_emission_version_gate; do
              cargo test --locked --test cli_tests "$target" -- --list > "$RUNNER_TEMP/cli-dimension-selected.txt"
              grep -Eq ': test$' "$RUNNER_TEMP/cli-dimension-selected.txt"
              cargo test --locked --test cli_tests "$target" -- --nocapture
            done
          } 2>&1 | tee "$RUNNER_TEMP/code-dimension-cli-gates.log"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check strict lints
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-dimension-contracts
          path: |
            ${{ runner.temp }}/code-dimension-contracts.log
            ${{ runner.temp }}/code-dimension-cli-gates.log
          retention-days: 14
          if-no-files-found: error
