name: Apply borrowed semantic save hardening
on:
  push:
    branches: [hardening/borrowed-semantic-save]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/borrowed-semantic-save
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply patch
        run: python .github/scripts/patch-borrowed-semantic-save.py
      - name: Format and test
        run: |
          cargo fmt --all
          cargo test semantic:: --all-features -- --nocapture
          cargo check --all-features
      - name: Clean patch scaffolding
        run: rm .github/scripts/patch-borrowed-semantic-save.py .github/workflows/zz-patch-borrowed-semantic-save.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "hardening: persist semantic vectors without cloning payloads"
          git push origin HEAD:hardening/borrowed-semantic-save
