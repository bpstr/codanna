name: Compact compatibility qualification
on:
  push:
    branches: [codex/compact-budgeted-tool-results]
    paths: [.github/workflows/compact-compat-qualification.yml]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-all-crates: true
      - name: Remove obsolete CLI-only search serializers
        id: publish
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/cli/commands/mcp.rs')
          text = path.read_text()
          start = '/// Symbol info extracted from search result for consistent JSON shape.'
          end = '/// Run the MCP direct tool invocation command.'
          assert text.count(start) == 1 and text.count(end) == 1
          a, b = text.index(start), text.index(end)
          removed = text[a:b]
          assert 'struct SymbolInfo {' in removed and 'struct SearchSymbolResult {' in removed
          assert 'impl From<crate::storage::tantivy::SearchResult> for SearchSymbolResult' in removed
          assert text.count('SearchSymbolResult') == removed.count('SearchSymbolResult')
          assert text.count('SymbolInfo') == removed.count('SymbolInfo')
          path.write_text(text[:a] + text[b:])
          PY
          cargo fmt --all
          test "$(git diff --name-only)" = src/cli/commands/mcp.rs
          git add src/cli/commands/mcp.rs
          git diff --cached --check
          git config user.name 'Fent Jani'
          git config user.email '37303771+bpstr@users.noreply.github.com'
          git commit -m 'Remove obsolete CLI-only search serializers'
          git rev-parse HEAD | tee "$RUNNER_TEMP/final-tested-sha.txt"
          header=$(printf 'x-access-token:%s' "$GH_WRITE_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $header" push origin HEAD:refs/heads/codex/compact-budgeted-tool-results
      - name: Strict all-target lint
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/final-clippy.log"
      - name: Run offline regression groups
        if: (success() || failure()) && steps.publish.outcome == 'success'
        run: |
          set -uo pipefail
          status=0
          run_group() { "$@" 2>&1 | tee -a "$RUNNER_TEMP/final-tests.log"; code=${PIPESTATUS[0]}; if [ "$code" != 0 ]; then status=1; fi; }
          run_group cargo test --locked --lib mcp::output -- --nocapture
          run_group cargo test --locked --test compact_tool_results --test context_limit_diagnostics --test document_retrieval_support --test semantic_fallback_contracts --test symbol_ranking_regressions --test symbol_scope_cli --test ticket_related_cli --test frozen_retrieval_holdout --test symbol_path_scope -- --nocapture
          run_group cargo test --locked --lib semantic_context_preserves_results_when_one_impact_exceeds_budget -- --nocapture
          run_group cargo test --locked --lib ticket_related -- --nocapture
          run_group cargo test --locked --test cli_tests mcp_line_convention -- --nocapture
          run_group cargo test --locked --test cli_tests mcp_exit_code_matrix -- --nocapture
          run_group cargo test --locked --test semantic_rebuild_reuse semantic_cli_json_reports_retrieval_for_populated_and_empty_results -- --nocapture
          run_group cargo test --locked --test workspace_recall -- --nocapture
          exit "$status"
      - name: Record exact source
        if: always()
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/final-source-sha.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/final-source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-final-qualification
          path: |
            ${{ runner.temp }}/final-*.log
            ${{ runner.temp }}/final-*.txt
            ${{ runner.temp }}/final-source.tar.gz
          retention-days: 7
