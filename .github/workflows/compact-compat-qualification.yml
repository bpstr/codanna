name: Compact compatibility qualification
on:
  push:
    branches: [codex/compact-budgeted-tool-results]
    paths: [.github/workflows/compact-compat-qualification.yml]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Apply compatibility changes with source guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, zlib, os
          encoded = ''
          raw = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest() == '139e258a8e4a5921e0394da0e072fc867d8bc22f8a3c084ae5eb091516eb1cf7'
          edits = json.loads(raw)
          for name, spec in edits.items():
              path = pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              before = path.read_bytes()
              assert hashlib.sha256(before).hexdigest() == spec['old_sha256'], name
              text = before.decode()
              for old, new, count in spec['changes']:
                  assert text.count(old) == count, (name, old)
                  text = text.replace(old, new)
              path.write_text(text)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'compat-paths.json').write_text(json.dumps(list(edits)))
          print(f'Applied {len(edits)} guarded source/test changes; frozen oracle unchanged')
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-all-crates: true
      - name: Format and publish code only
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cargo fmt --all
          python3 - <<'PY'
          import json, pathlib, os, subprocess
          paths = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'compat-paths.json').read_text())
          changed = subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          assert set(changed) <= set(paths), changed
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git diff --cached --check
          git config user.name 'Fent Jani'
          git config user.email '37303771+bpstr@users.noreply.github.com'
          git commit -m 'Preserve scope errors and migrate compact output witnesses'
          git rev-parse HEAD | tee "$RUNNER_TEMP/compat-tested-sha.txt"
          header=$(printf 'x-access-token:%s' "$GH_WRITE_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $header" push origin HEAD:refs/heads/codex/compact-budgeted-tool-results
      - name: Check all targets
        run: |
          set -euo pipefail
          cargo check --locked --all-targets --all-features 2>&1 | tee "$RUNNER_TEMP/compat-check.log"
      - name: Run offline contract groups
        run: |
          set -uo pipefail
          status=0
          run_group() { "$@" 2>&1 | tee -a "$RUNNER_TEMP/compat-tests.log"; code=${PIPESTATUS[0]}; if [ "$code" != 0 ]; then status=1; fi; }
          run_group cargo test --locked --lib mcp::output -- --nocapture
          run_group cargo test --locked --test compact_tool_results --test context_limit_diagnostics --test document_retrieval_support --test semantic_fallback_contracts --test symbol_ranking_regressions --test symbol_scope_cli --test ticket_related_cli --test frozen_retrieval_holdout --test symbol_path_scope -- --nocapture
          run_group cargo test --locked --lib semantic_context_preserves_results_when_one_impact_exceeds_budget -- --nocapture
          run_group cargo test --locked --lib ticket_related -- --nocapture
          run_group cargo test --locked --test cli_tests mcp_line_convention -- --nocapture
          run_group cargo test --locked --test cli_tests mcp_exit_code_matrix -- --nocapture
          run_group cargo test --locked --test semantic_rebuild_reuse semantic_cli_json_reports_retrieval_for_populated_and_empty_results -- --nocapture
          run_group cargo test --locked --test workspace_recall -- --nocapture
          exit "$status"
      - name: Strict lint
        if: success() || failure()
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/compat-clippy.log"
      - name: Record source
        if: always()
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/compat-source-sha.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/compat-source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-compatibility
          path: |
            ${{ runner.temp }}/compat-*.log
            ${{ runner.temp }}/compat-*.txt
            ${{ runner.temp }}/compat-source.tar.gz
          retention-days: 7
