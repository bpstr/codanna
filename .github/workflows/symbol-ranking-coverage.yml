name: Symbol ranking coverage
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/storage/tantivy/query.rs'
      - 'src/storage/tantivy/mod.rs'
      - 'src/mcp/tools/search.rs'
      - 'src/mcp/tools/context.rs'
      - 'tests/symbol_ranking_regressions.rs'
      - '.github/workflows/symbol-ranking-coverage.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: symbol-ranking-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run selected ranking contracts
        shell: bash
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            rustc --version
            sha256sum src/storage/tantivy/query.rs tests/symbol_ranking_regressions.rs
            cargo test --locked --test symbol_ranking_regressions --test retrieval_ranking_regressions -- --nocapture
            cargo test --locked --test adversarial_regressions search_graph -- --nocapture
          } 2>&1 | tee "$RUNNER_TEMP/symbol-ranking-coverage.log"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check strict lints
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: symbol-ranking-coverage
          path: ${{ runner.temp }}/symbol-ranking-coverage.log
          retention-days: 14
          if-no-files-found: error
