name: Retrieval body merge audit
on:
  pull_request:
    branches: [fix/code-embedding-dimensions]
    paths: ['.github/workflows/retrieval-body-merge-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: retrieval-body-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect pinned merge without changing any remote ref
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Integration audit'
          git config user.email 'integration-audit@localhost'
          git merge-base --is-ancestor 1f8cc2e4031c4ad167bd409414d15bda62827da9 HEAD
          git cat-file -e 8b8f08c4bee87264665f0df02134089b7632b49f^{commit}
          status=0
          git merge --no-commit --no-ff 8b8f08c4bee87264665f0df02134089b7632b49f > "$RUNNER_TEMP/merge.log" 2>&1 || status=$?
          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
          git ls-files -u > "$RUNNER_TEMP/conflict-stages.txt"
          git diff --cached --raw > "$RUNNER_TEMP/merge-raw.txt"
          git diff --cached --stat > "$RUNNER_TEMP/merge-stat.txt"
          git diff --binary > "$RUNNER_TEMP/unstaged.patch"
          tar --exclude=.git --exclude=target -czf "$RUNNER_TEMP/retrieval-body-source.tar.gz" .
          cat "$RUNNER_TEMP/merge.log"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-body-merge-audit
          path: |
            ${{ runner.temp }}/merge.log
            ${{ runner.temp }}/conflicts.txt
            ${{ runner.temp }}/conflict-stages.txt
            ${{ runner.temp }}/merge-raw.txt
            ${{ runner.temp }}/merge-stat.txt
            ${{ runner.temp }}/unstaged.patch
            ${{ runner.temp }}/retrieval-body-source.tar.gz
          retention-days: 14
          if-no-files-found: error
