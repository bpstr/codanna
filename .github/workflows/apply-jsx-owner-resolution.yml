# Temporary branch-only application of the reviewed column-ownership patch.
name: Apply reviewed JSX repair

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/patches/jsx-owner-resolution.patch'
      - '.github/workflows/apply-jsx-owner-resolution.yml'

permissions:
  contents: write

concurrency:
  group: apply-reviewed-jsx-repair
  cancel-in-progress: false

jobs:
  contracts:
    if: github.repository == 'bpstr/codanna' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/jsx-owner-resolution'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/jsx-owner-resolution
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: jsx-impact
          cache-on-failure: true
          cache-all-crates: true
      - name: Record the column-ownership baseline
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          test "$(git hash-object src/indexing/pipeline/stages/collect.rs)" = 526d8ddcebc3c9eb99525a2cd3e898e42960a29d
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rustfmt --edition 2024 tests/jsx_owner_columns.rs
          git diff --check
          git add tests/jsx_owner_columns.rs
          if ! git diff --cached --quiet; then
            git commit -m 'Format source-column ownership fixtures'
            git push origin HEAD:refs/heads/fix/jsx-owner-resolution
          fi
          {
            git rev-parse HEAD
            sha256sum tests/jsx_owner_columns.rs src/indexing/pipeline/stages/collect.rs
            cargo test --locked --test jsx_owner_columns --no-run
          } 2>&1 | tee "$RUNNER_TEMP/jsx-columns-baseline-build.log"
          set +e
          cargo test --locked --test jsx_owner_columns -- --nocapture 2>&1 | tee "$RUNNER_TEMP/jsx-columns-baseline.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q 'test result: FAILED' "$RUNNER_TEMP/jsx-columns-baseline.log"
      - name: Apply the reviewed collector patch and commit
        shell: bash
        run: |
          set -euo pipefail
          patch=.github/patches/jsx-owner-resolution.patch
          test "$(git hash-object "$patch")" = b799968c74a702a501d20e69ba811881b27712e8
          git diff --quiet
          git diff --cached --quiet
          git apply --check "$patch"
          git apply "$patch"
          rustfmt --edition 2024 src/indexing/pipeline/stages/collect.rs
          git diff --check
          git add src/indexing/pipeline/stages/collect.rs
          git commit -m 'Use source columns to reconnect same-named relationship owners'
          git push origin HEAD:refs/heads/fix/jsx-owner-resolution
      - name: Verify JSX and collector contracts
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            sha256sum tests/jsx_owner_columns.rs src/indexing/pipeline/stages/collect.rs
            cargo test --locked --test jsx_owner_columns --test jsx_impact_regressions -- --nocapture
            cargo test --locked --lib indexing::pipeline::stages::collect::tests
          } 2>&1 | tee "$RUNNER_TEMP/jsx-columns-candidate.log"
      - name: Retain tested sources
        if: always()
        shell: bash
        run: tar -czf "$RUNNER_TEMP/jsx-columns-source.tar.gz" src/indexing/pipeline/stages/collect.rs tests/jsx_owner_columns.rs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jsx-column-evidence
          path: |
            ${{ runner.temp }}/jsx-columns-baseline-build.log
            ${{ runner.temp }}/jsx-columns-baseline.log
            ${{ runner.temp }}/jsx-columns-candidate.log
            ${{ runner.temp }}/jsx-columns-source.tar.gz
          retention-days: 14
          if-no-files-found: error
