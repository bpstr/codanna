name: Apply reviewed rebuild cache repair
on:
  pull_request:
    branches: [main]
    paths:
      - 'contributing/scripts/apply-semantic-rebuild-reuse.py'
      - '.github/workflows/apply-semantic-rebuild-reuse.yml'
permissions:
  contents: read
concurrency:
  group: apply-rebuild-cache-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'bpstr/codanna' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/semantic-rebuild-reuse'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      WORK_BRANCH: fix/semantic-rebuild-reuse
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Preserve the executable baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if grep -q 'semantic.restore_rebuild_cache(&semantic_path);' src/indexing/facade.rs; then
            echo 'Repair already applied; source was not changed.'
            exit 1
          fi
          cargo fmt --all
          git add tests/semantic_rebuild_reuse.rs
          if ! git diff --cached --quiet; then
            git commit -m 'Format rebuild reuse regression fixtures'
            git push origin "HEAD:$WORK_BRANCH"
          fi
          git rev-parse HEAD | tee "$RUNNER_TEMP/rebuild-baseline-revision.txt"
          cargo test --locked --test semantic_rebuild_reuse --no-run
          set +e
          cargo test --locked --test semantic_rebuild_reuse -- --nocapture 2>&1 | tee "$RUNNER_TEMP/rebuild-baseline.log"
          result=${PIPESTATUS[0]}
          set -e
          echo "baseline_exit_status=$result" >> "$RUNNER_TEMP/rebuild-baseline.log"
      - name: Apply only the reviewed source edit and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 contributing/scripts/apply-semantic-rebuild-reuse.py
          cargo fmt --all
          git diff --check
          git add src/semantic/simple.rs src/semantic/rebuild_cache.rs src/indexing/facade.rs
          git commit -m 'Restore compatible embedding inputs when rebuilding symbol generations'
          git push origin "HEAD:$WORK_BRANCH"
          git rev-parse HEAD | tee "$RUNNER_TEMP/rebuild-candidate-revision.txt"
      - name: Verify input reuse and cache identity controls
        shell: bash
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            sha256sum src/semantic/simple.rs src/semantic/rebuild_cache.rs src/indexing/facade.rs tests/semantic_rebuild_reuse.rs
            cargo test --locked --lib semantic::simple::rebuild_cache
            cargo test --locked --test semantic_rebuild_reuse -- --nocapture
            cargo test --locked --test document_embedding_regressions --test index_lifecycle_regressions
          } 2>&1 | tee "$RUNNER_TEMP/rebuild-candidate.log"
      - name: Retain the tested sources
        if: always()
        shell: bash
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/rebuild-tested-source.tar.gz" HEAD src/semantic/simple.rs src/semantic/rebuild_cache.rs src/indexing/facade.rs tests/semantic_rebuild_reuse.rs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebuild-cache-repair
          path: |
            ${{ runner.temp }}/rebuild-*.log
            ${{ runner.temp }}/rebuild-*-revision.txt
            ${{ runner.temp }}/rebuild-tested-source.tar.gz
          retention-days: 14
